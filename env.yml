name: duopogen_env
channels:
  - conda-forge
  - bioconda
dependencies:
  # ---- interpreter ----
  - python=3.14

  # ---- native tools (no Python linkage; safe from bioconda) ----
  # htslib 1.23.x matches what pysam 0.24 wraps -- keep these in lockstep
  - samtools=1.23
  - bcftools=1.23
  - htslib=1.23
  - vcftools=0.1.17
  - openjdk=21          # Beagle 4.1 needs >=1.8; 21 is fine and current

  # ---- R side (LDrefinement / somatic only -- drop if germline-only) ----
  - r-base=4.5
  - r-data.table
  - r-e1071
  - r-ggplot2

  # ---- build deps, in case a wheel is missing and pip falls back to sdist ----
  - cython>=3.0
  - pkg-config
  - zlib
  - bzip2
  - xz
  - libcurl

  # ---- Python packages via pip: conda-forge/bioconda lag on cp314 ----
  - pip
  - pip:
      - "pysam>=0.24.0"     # first release with cp314 wheels + htslib 1.23.1
      - "numpy>=2.3"
      - "pandas>=2.3"
      - "scipy>=1.16"
      - "pillow>=11.3"