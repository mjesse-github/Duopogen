name: duopogen_env
channels:
  - conda-forge
  - bioconda
  - nodefaults          # keep the defaults channel out; it drags in old htslib
dependencies:
  - python=3.14
  # Pin the STANDARD (GIL) build. Without this the solver may pick the
  # free-threaded variant -- you can spot it by cp314t ABI tags in pip
  # output instead of cp314. Free-threaded 3.14 is slower single-threaded,
  # has no pysam wheel (so pysam compiles from source, several minutes),
  # and buys nothing here: parallelism is multiprocessing, not threads.
  - python_abi=3.14=*_cp314

  # htslib stack -- keep all three on the same minor version as the htslib
  # that pysam 0.24 bundles (1.23.x). Skew here causes BGZF/EOF-marker
  # weirdness that surfaces as truncated .vcf.gz.
  - samtools=1.23
  - bcftools=1.23
  - htslib=1.23                 # provides bgzip (and tabix)

  # runs apps/beagle.27Jul16.86a.jar. Beagle 4.1 targets Java 8 bytecode;
  # 21 runs it fine. Drop to openjdk=17 if you hit anything odd.
  - openjdk=21
 
  - pip
  - pip:
      # cp314 wheel; wraps htslib 1.23.1. Should install in seconds --
      # if pip starts "Building wheel for pysam", you are on 3.14t.
      - "pysam==0.24.0"

# Deliberately NOT here:
#   numpy, pandas, scipy, pillow -- nothing in Duopogen.py or germline.py
#                   imports them once the monovar tree is deleted.
#   beagle       -- bioconda ships 5.x, which cannot take gl= input.
#                   The 4.1 jar stays vendored in apps/.
#   r-base, r-*  -- LDrefinement.R only (somatic, removed).
#   vcftools, picard -- asserted by upstream check_dependencies, never invoked.